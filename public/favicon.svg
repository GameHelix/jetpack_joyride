<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#050514" stroke="#00d4ff" stroke-width="2"/>

  <!-- Neon glow filter -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Jetpack body -->
  <rect x="36" y="18" width="10" height="24" rx="3" fill="#334455" filter="url(#glow)"/>
  <rect x="37" y="36" width="8" height="6" rx="1" fill="#223344"/>

  <!-- Flame from jetpack -->
  <ellipse cx="41" cy="46" rx="4" ry="6" fill="#ff6600" opacity="0.9"/>
  <ellipse cx="41" cy="47" rx="2.5" ry="4" fill="#ffdd00"/>

  <!-- Character body -->
  <rect x="16" y="20" width="22" height="20" rx="5" fill="#005577"/>

  <!-- Visor -->
  <rect x="19" y="23" width="10" height="7" rx="3" fill="#00d4ff"/>
  <rect x="21" y="25" width="4" height="2" rx="1" fill="rgba(255,255,255,0.5)"/>

  <!-- Boots -->
  <rect x="18" y="38" width="8" height="5" rx="2" fill="#002233"/>
  <rect x="28" y="38" width="8" height="5" rx="2" fill="#002233"/>

  <!-- Speed lines -->
  <line x1="6" y1="28" x2="14" y2="28" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="4" y1="32" x2="13" y2="32" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
  <line x1="6" y1="36" x2="14" y2="36" stroke="#00d4ff" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
</svg>
